<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820"><defs><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#082e80"/><stop offset=".62" stop-color="#2444b2"/><stop offset="1" stop-color="#0b1d50"/></linearGradient><radialGradient id="glow"><stop stop-color="#779fff" stop-opacity=".4"/><stop offset="1" stop-color="#779fff" stop-opacity="0"/></radialGradient></defs><rect width="1440" height="820" fill="#e8ecfc"/><rect width="1440" height="70" fill="#fff"/><text x="50" y="43" font-size="21" fill="#111d38" font-family="Arial" font-weight="bold">UBI RMUTL</text><text x="1270" y="42" font-size="16" fill="#1b2a4c" font-family="Arial" font-weight="bold">หน้าหลัก</text><text x="1360" y="42" font-size="16" fill="#1b2a4c" font-family="Arial" font-weight="bold">เข้าสู่ระบบ</text><rect x="36" y="100" width="870" height="630" rx="22" fill="url(#blue)"/><circle cx="670" cy="300" r="280" fill="url(#glow)"/><rect x="73" y="151" width="243" height="34" rx="17" fill="#6177b1" fill-opacity=".45"/><text x="96" y="173" fill="#c7dbff" font-size="15" font-family="sans-serif">แพลตฟอร์มบริหารผู้ประกอบการ</text><text x="76" y="265" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="47">ระบบประเมินผู้ประกอบการ</text><text x="76" y="323" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="47">แบบครบวงจร</text><text x="76" y="380" fill="#d0dcff" font-family="sans-serif" font-size="21">ประเมินศักยภาพ ทักษะสำคัญ และข้อมูลเชิงธุรกิจ</text><text x="76" y="412" fill="#d0dcff" font-family="sans-serif" font-size="21">อย่างชาญฉลาดในที่เดียว</text><g fill="#8294da" fill-opacity=".27" stroke="#6678b9" stroke-width="1"><rect x="77" y="463" width="250" height="118" rx="18"/><rect x="342" y="463" width="250" height="118" rx="18"/><rect x="606" y="463" width="250" height="118" rx="18"/></g><g font-family="sans-serif" font-size="19" fill="#f3f7ff" font-weight="bold"><text x="99" y="503">ประเมินศักยภาพ</text><text x="364" y="503">โปรไฟล์ผู้ประกอบการ</text><text x="628" y="503">วิเคราะห์และรายงาน</text></g><g font-family="sans-serif" font-size="14" fill="#c6d5ff"><text x="99" y="534">ทักษะและความพร้อม</text><text x="364" y="534">ติดตามการพัฒนา</text><text x="628" y="534">ข้อมูลสำหรับตัดสินใจ</text></g><rect x="77" y="610" width="779" height="88" rx="18" fill="#071c61" fill-opacity=".65"/><text x="109" y="646" font-size="19" fill="#fff" font-family="sans-serif">✓  เริ่มต้นการประเมินได้ง่าย</text><text x="109" y="678" font-size="16" fill="#ceddff" font-family="sans-serif">เข้าสู่ระบบ เลือกแบบประเมิน และติดตามผลลัพธ์</text><rect x="930" y="101" width="469" height="629" rx="23" fill="#fff" stroke="#cfd7eb"/><rect x="978" y="159" width="160" height="34" rx="17" fill="#eff5ff"/><text x="1004" y="181" fill="#5477b9" font-size="14" font-family="sans-serif">เริ่มต้นที่นี่</text><text x="975" y="248" fill="#1c2a45" font-size="30" font-family="sans-serif" font-weight="bold">เข้าสู่ระบบเพื่อเริ่มต้น</text><text x="975" y="289" fill="#1c2a45" font-size="30" font-family="sans-serif" font-weight="bold">การประเมิน</text><text x="975" y="335" fill="#8895af" font-size="16" font-family="sans-serif">กรอกข้อมูลของคุณเพื่อเข้าสู่แดชบอร์ด</text><text x="975" y="410" fill="#48546c" font-size="17" font-family="sans-serif">ชื่อผู้ใช้ / เบอร์โทรศัพท์ / อีเมล</text><rect x="975" y="428" width="374" height="51" rx="9" fill="#fafbff" stroke="#d9e1f0"/><text x="975" y="523" fill="#48546c" font-size="17" font-family="sans-serif">รหัสผ่าน</text><rect x="975" y="539" width="374" height="51" rx="9" fill="#fafbff" stroke="#d9e1f0"/><rect x="975" y="612" width="374" height="55" rx="10" fill="#356bec"/><text x="1163" y="648" fill="#fff" font-size="21" font-family="sans-serif" font-weight="bold" text-anchor="middle">เข้าสู่ระบบ</text></svg>